<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>PlusConnect API – Technická dokumentace</title>
<style>
  @page {
    size: A4;
    margin: 25mm 20mm 25mm 20mm;
    @bottom-center { content: "PlusConnect API Dokumentace – Strana " counter(page); font-size: 9px; color: #888; }
  }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 11pt; line-height: 1.55; color: #222; }
  h1 { font-size: 26pt; color: #1a1a2e; margin-top: 0; border-bottom: 4px solid #B5E126; padding-bottom: 10px; }
  h2 { font-size: 16pt; color: #1a1a2e; margin-top: 32px; border-bottom: 2px solid #e0e0e0; padding-bottom: 6px; }
  h3 { font-size: 13pt; color: #333; margin-top: 22px; }
  h4 { font-size: 11pt; color: #555; margin-top: 14px; margin-bottom: 4px; }
  code { background: #f4f4f4; padding: 1px 5px; border-radius: 3px; font-size: 10pt; font-family: 'Consolas', 'Courier New', monospace; }
  pre { background: #1e1e2e; color: #cdd6f4; padding: 14px 16px; border-radius: 6px; font-size: 9.5pt; line-height: 1.45; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  pre .kw { color: #cba6f7; }
  pre .str { color: #a6e3a1; }
  pre .num { color: #fab387; }
  pre .comment { color: #6c7086; font-style: italic; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0 18px 0; font-size: 10pt; }
  th { background: #1a1a2e; color: #fff; padding: 8px 10px; text-align: left; font-weight: 600; }
  td { padding: 7px 10px; border-bottom: 1px solid #e0e0e0; }
  tr:nth-child(even) td { background: #fafafa; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 9pt; font-weight: 700; color: #fff; margin-right: 6px; vertical-align: middle; }
  .badge-get { background: #2196F3; }
  .badge-post { background: #4CAF50; }
  .badge-delete { background: #f44336; }
  .endpoint-box { background: #f8f9fa; border: 1px solid #dee2e6; border-left: 4px solid #B5E126; padding: 12px 16px; margin: 10px 0; border-radius: 4px; }
  .endpoint-box code { background: none; font-size: 11pt; font-weight: 600; }
  .note { background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px 14px; margin: 12px 0; border-radius: 4px; font-size: 10pt; }
  .note strong { color: #856404; }
  .error-box { background: #f8d7da; border-left: 4px solid #dc3545; padding: 10px 14px; margin: 12px 0; border-radius: 4px; font-size: 10pt; }
  .cover { text-align: center; padding: 120px 0 60px 0; page-break-after: always; }
  .cover h1 { font-size: 36pt; border: none; padding: 0; }
  .cover .subtitle { font-size: 14pt; color: #666; margin-top: 10px; }
  .cover .version { font-size: 11pt; color: #999; margin-top: 40px; }
  .cover .logo-text { font-size: 48pt; font-weight: 800; color: #1a1a2e; letter-spacing: -1px; }
  .cover .logo-accent { color: #B5E126; }
  .toc { page-break-after: always; }
  .toc h2 { border: none; }
  .toc ul { list-style: none; padding: 0; }
  .toc li { padding: 6px 0; border-bottom: 1px dotted #ccc; font-size: 11pt; }
  .toc li a { text-decoration: none; color: #1a1a2e; }
  .section { page-break-inside: avoid; }
  .flow-diagram { background: #f8f9fa; border: 1px solid #dee2e6; padding: 16px; border-radius: 6px; font-family: monospace; font-size: 9.5pt; line-height: 1.7; margin: 12px 0; }
